name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - run: python -m eval
      - run: test -f eval/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.md
